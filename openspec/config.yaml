schema: spec-driven

context: |
  Sistema: NetHub — ferramenta TUI para administração de infraestrutura.
  Escopo descrito nas fontes atuais: descoberta de rede, inventário, operações remotas, workflows e auditoria.
  As especificações registram a linha de base dos requisitos funcionais presentes no material do projeto.

rules:
  proposal:
    - Escrever o conteúdo em português.
  specs:
    - Escrever o conteúdo em português e preservar os cabeçalhos OpenSpec em inglês.
    - Usar IDs estáveis RFnn e NF-CAT-nn, sem renumerar ou reutilizar IDs publicados.
    - Cada requisito deve ter prioridade, casos de uso relacionados e pelo menos um cenário verificável.
    - Não transformar critérios não definidos nas fontes em metas inventadas; explicitar pendências.
